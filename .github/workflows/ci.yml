name: CI
on: [pull_request, workflow_dispatch]
jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       label: macos-arm64 }
          # - { os: macos-13,       label: macos-x86_64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: ubuntu-24.04,   label: linux-x86_64 }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest pytest-qt
      - name: Build native libs
        run: python scripts/build_native.py
      - name: Install Qt system libs (Linux offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libpulse0
      - name: Run tests (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: Build bundle
        run: pyinstaller radiata.spec --noconfirm

      - name: Smoke (headless self-test) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./dist/RadiataModdingTool.exe --self-test
      - name: Smoke (headless self-test) (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./dist/RadiataModdingTool/RadiataModdingTool --self-test

      - name: Smoke (headless self-test) (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ -d "dist/RadiataModdingTool.app" ]; then
            ./dist/RadiataModdingTool.app/Contents/MacOS/RadiataModdingTool --self-test
          else
            ./dist/RadiataModdingTool/RadiataModdingTool --self-test
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: bundle-${{ matrix.label }}
          path: |
            dist/RadiataModdingTool.exe
            dist/RadiataModdingTool.app
            dist/RadiataModdingTool
          if-no-files-found: error
