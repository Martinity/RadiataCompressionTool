name: Release
# MAINTAINER-GATED: triggers only on v* tags. Confirm versioning/branching before tagging.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # - { os: macos-14,       label: macos-arm64,  arch: arm64 }
          # - { os: macos-13,       label: macos-x86_64, arch: x86_64 }
          - { os: windows-latest, label: windows-x64,  arch: x64 }
          - { os: ubuntu-22.04,   label: linux-x86_64, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Inject version from tag
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME#v}\"" > core/_version.py
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build native libs
        run: python scripts/build_native.py
      - name: Build bundle
        run: pyinstaller radiata.spec --noconfirm

      # - name: Package (macOS)
      #   if: runner.os == 'macOS'
      #   run: bash scripts/package-macos.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"

      - name: Install appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo wget -O /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Package (Linux)
        if: runner.os == 'Linux'
        env: { APPIMAGE_EXTRACT_AND_RUN: 1 }
        run: bash scripts/package-linux.sh "${GITHUB_REF_NAME}" "${{ matrix.arch }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/RadiataModdingTool.exe -DestinationPath "RadiataModdingTool-${{ github.ref_name }}-windows-x64.zip"

      - name: Generate SHA-256 Checksums (Windows)
        if: runner.os  == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem *.zip | ForEach-Object { 
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath SHA256SUM-windows-x64.txt -Append
          }
      - name: Generate SHA-256 Checksums (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sha256sum *.AppImage > SHA256SUM-linux-x86_64.txt
      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.AppImage
            *.zip
            SHA256SUM-*
          body: |
            ### Installation Instructions - ${{ github.ref_name }}
            
            **Windows User Note:**
            This build is unsigned. Windows SmartScreen will show a warning alert.
            Click **More info** → **Run anyway** to launch the tool.
            
            **Linux User Note:**
            Make the AppImage executable before launching:
            ```bash
            chmod +x RadiataModdingTool-*.AppImage
            ./RadiataModdingTool-*.AppImage
            ```
            
            ### Integrity Verification (Optional)
            Verify your downloads match the compile-time binary fingerprints:
            - **Linux:** `sha256sum -c SHA256SUM-linux-x86_64` 
            - **Windows (PowerShell):** `Get-FileHash .\RadiataModdingTool-*.zip` compare to `SHA256SUM-windows-x64`
